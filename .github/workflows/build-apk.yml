name: Build APK

on:
  workflow_dispatch:  # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init TWA project
        run: |
          mkdir twa-build && cd twa-build
          bubblewrap init --manifest https://yabaggi.github.io/Peco/manifest.json \
            --directory . \
            --packageId com.yabaggi.peco \
            --name "PECO Documentary App" \
            --launcherName "PECO" \
            --display standalone \
            --themeColor "#2196f3" \
            --backgroundColor "#ffffff" \
            --startUrl "/" \
            --iconUrl "https://yabaggi.github.io/Peco/icons/icon-512x512.png" \
            --maskableIconUrl "https://yabaggi.github.io/Peco/icons/icon-512x512.png"

      - name: Build APK
        run: |
          cd twa-build
          bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: peco-apk
          path: twa-build/app-release-signed.apk
