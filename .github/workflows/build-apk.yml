name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with pwa2apk
        run: |
          git clone --depth 1 https://github.com/trycua/pwa2apk.git
          cd pwa2apk
          npm install
          node bin/pwa2apk.js \
            https://yabaggi.github.io/Peco/manifest.json \
            --package com.yabaggi.peco \
            --output ../peco.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peco-apk
          path: ./peco.apk
