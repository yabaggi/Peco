name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clone TWA Quickstart template
        run: |
          git clone https://github.com/GoogleChromeLabs/svgomg-twa.git twa
          cd twa

      - name: Configure TWA
        run: |
          cd twa
          # Set your app details
          sed -i 's|https://svgomg.firebaseapp.com|https://yabaggi.github.io/Peco/|g' app/build.gradle
          sed -i 's|com.svgomg.twa|com.yabaggi.peco|g' app/build.gradle
          sed -i 's|SVGOMG|PECO|g' app/build.gradle
          sed -i 's|SVGOMG - SVG Optimizer|PECO Documentary App|g' app/build.gradle

      - name: Accept Android licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          cd twa
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peco-apk
          path: twa/app/build/outputs/apk/release/*.apk
