name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Accept Android licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Init TWA
        run: |
          mkdir twa && cd twa
          echo -e "n\n" | bubblewrap init \
            --manifest "https://yabaggi.github.io/Peco/manifest.json" \
            --directory "."

      - name: Build APK
        run: |
          cd twa
          echo -e "\n\n\n\n" | bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peco-apk
          path: twa/app-release-signed.apk
